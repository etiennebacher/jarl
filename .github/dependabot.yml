# Adapted from https://github.com/pola-rs/polars/blob/main/.github/dependabot.yml

version: 2
updates:
  # GitHub Actions
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    exclude-paths:
      # This file is generated by cargo-dist, never let dependabot update it or
      # the release workflow will fail
      - ".github/workflows/release.yml"
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-patch']
    commit-message:
      prefix: ci
    groups:
      ci:
        patterns:
          - '*'

  # Rust part
  - package-ecosystem: cargo
    directory: '/'
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-patch']
      # Enable this one once they have a proper changelog:
      # https://github.com/zed-industries/zed/discussions/52144
      - dependency-name: "zed_extension_api:*"
    commit-message:
      prefix: build
      prefix-development: chore(rust)
    groups:
      # Major updates are intentionally ungrouped so each gets its own PR
      rust:
        update-types:
          - minor
          - patch

  # VS Code / Positron extension
  - package-ecosystem: npm
    directory: '/editors/code'
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-patch']
      # Must not be newer than `engines.vscode` in package.json, otherwise
      # `vsce package` fails
      - dependency-name: '@types/vscode'
      # Versions >= 3.2 are empty deprecation stubs, which leaves `p-queue`
      # (aliased to @esm2cjs/p-queue, no CJS typings) without a declaration
      - dependency-name: '@types/p-queue'
      # Matches the Node version shipped with VS Code
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # typescript-eslint doesn't support TS 7 yet:
      # https://github.com/typescript-eslint/typescript-eslint/issues/10940
      - dependency-name: 'typescript'
        versions: ['>= 7']
    commit-message:
      prefix: build
      prefix-development: chore(vscode)
    groups:
      # Major updates are intentionally ungrouped so each gets its own PR
      vscode:
        update-types:
          - minor
          - patch
