# Produces benchmark results then published by "benchmark-comment.yml".
# See comment in "benchmark-comment.yml".

name: Benchmark

# "edited" is included so that retargeting the PR to another base branch
# re-runs the comparison against the new base.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - .github/workflows/benchmark.yml
      - .github/scripts/process_bench_ci.R
      - Cargo.toml
      - Cargo.lock
      - crates/**/src/**
      - crates/**/Cargo.toml
      - "!crates/jarl-lsp/**"

# Ensure that modifying the PR body while the workflow is running doesn't
# interrupt the workflow.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}-${{ github.event.action != 'edited' || github.event.changes.base != null }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Prefer "github.event.pull_request.base.ref" over "github.base_ref" because
  # the latter will use the base of the entire stack in stacked PRs.
  BASE_REF: ${{ github.event.pull_request.base.ref }}
  # Same repositories as ecosystem-check for consistency
  TEST_REPOS: |
    easystats/datawizard@7466ff6f91040e25f826b224a4ef5e9aeb63b567
    lrberge/stringmagic@87b187d40c745ea1d8496f071aee7229985da23c
    pola-rs/r-polars@055f891d977d6a8004fe8ab1bb5d47cfdd44872a
    Rdatatable/data.table@d7833cb3a0c36ab329fcfe5cc1523449663f898f
    ropensci/targets@d45243e1a239da467c6e96e0069ecb7368f78021
    rstudio/shiny@b6e9e9d216cd574cf8985d23772399f51ee4a4ac
    tidyverse/dplyr@384ff2c4af79a9bd9142d8bdab23efbcd52f275b
    tidyverse/ggplot2@bed8e32d45c7dc98afb783b409edac98854d41a7
    vincentarelbundock/marginaleffects@ffe5a4f5962a9ba51c3e68e1c55eea62887c25da
    wch/r-source@b5cf23a805f4305852f55c4148f2a302b06844b5

jobs:
  benchmark:
    # For "edited" events, only run when the base branch was changed (not for
    # title/description edits).
    if: github.event.action != 'edited' || github.event.changes.base != null
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install hyperfine
        run: sudo apt install hyperfine

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          cache: false

      # The cache is only written by "warm-cache.yml", which runs on main.
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: jarl-release
          save-if: false

      - name: Set up R for package-specific rules and to process results
        uses: r-lib/actions/setup-r@v2.12.0
        with:
          use-public-rspm: true

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2.12.0

      # Note: in an ideal world, we'd install all dependencies of the packages
      # we test below, but this would make the CI much slower.
      - name: Install packages that have rules in Jarl
        run: |
          Rscript -e "install.packages(c('dplyr'))"

      - name: Install packages to process results
        run: |
          R -e "install.packages(c('data.table', 'jsonlite', 'pandoc', 'tinytable'))"

      - name: Build jarl binary from PR
        run: cargo build --profile benchmark --package jarl

      - name: Save PR binary path
        run: |
          cp target/benchmark/jarl target/benchmark/jarl-pr
          echo "PR_JARL=$(pwd)/target/benchmark/jarl-pr" >> $GITHUB_ENV

      - name: Build jarl binary from base branch
        run: |
          git fetch origin $BASE_REF
          git checkout origin/$BASE_REF
          cargo build --profile benchmark --package jarl

      - name: Save base binary path
        run: echo "BASE_JARL=$(pwd)/target/benchmark/jarl" >> $GITHUB_ENV
        
      - name: Clone all test repos
        run: |
          mkdir -p test-repos
          cd test-repos
          for repo in $TEST_REPOS; do
            # Skip category markers / comment words (only real entries have "@")
            case "$repo" in
              *@*) ;;
              *) continue ;;
            esac

            repo_name=$(echo "$repo" | cut -d'@' -f1)
            commit_sha=$(echo "$repo" | cut -d'@' -f2)
            repo_dir=$(echo "$repo_name" | tr '/' '_')

            git clone --revision=$commit_sha --depth 1 https://github.com/$repo_name.git $(echo $repo_dir | tr '/' '_')
          done

      - name: Run hyperfine on all repos
        run: |
          mkdir -p results_bench
          cd test-repos
          for repo in $TEST_REPOS; do
            echo "Benchmarking repo $repo..."
            repo_name=$(echo "$repo" | cut -d'@' -f1)
            repo_dir=$(echo "$repo_name" | tr '/' '_')

            # Run base branch (the "_base" suffix is expected by process_bench_ci.R)
            (cd "$repo_dir" && hyperfine --warmup 5 --min-runs 50 '$BASE_JARL check . --select ALL' --ignore-failure  --export-json ../../results_bench/${repo_dir}_base.json) || true

            # Run PR
            (cd "$repo_dir" && hyperfine --warmup 5 --min-runs 50 '$PR_JARL check . --select ALL' --ignore-failure  --export-json ../../results_bench/${repo_dir}_pr.json) || true
          done

      - name: Upload all result JSONs
        uses: actions/upload-artifact@v7
        with:
          name: hyperfine-json-results
          path: results_bench/

      - name: Process benchmark results
        run: |
          source(".github/scripts/process_bench_ci.R", echo = TRUE)
        shell: Rscript {0}

      - name: Save PR number for downstream comment workflow
        run: echo "${{ github.event.pull_request.number }}" > pr-number.txt

      - name: Upload PR number
        uses: actions/upload-artifact@v7
        with:
          name: pr-number
          path: pr-number.txt

      - name: Upload benchmark results for downstream comment workflow
        uses: actions/upload-artifact@v7
        with:
          name: bench-results
          path: benchmark.md
