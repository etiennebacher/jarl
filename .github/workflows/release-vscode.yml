name: Release extension

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the Jarl GitHub release to bundle
        required: true
        type: string

env:
  FETCH_DEPTH: 0

jobs:
  # Bump the extension version and add the bundled Jarl version to the
  # changelog. Entries under a "Development" heading are moved to the new
  # version.
  prepare:
    name: Bump extension version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}

    defaults:
      run:
        working-directory: ./editors/code

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Bump version and update changelog
        env:
          JARL_VERSION: ${{ inputs.tag }}
        run: |
          EXT_VERSION=$(npm version patch --no-git-tag-version)
          EXT_VERSION=${EXT_VERSION#v}
          ITEM="- This version bundles Jarl ${JARL_VERSION#v}."

          grep -qE '^##+ Development$' README.md ||
            sed -i 's/^## Changelog$/&\n\n### Development/' README.md

          awk -v ver="$EXT_VERSION" -v item="$ITEM" '
            /^##+ Development$/ { print "### " ver; dev = 1; next }
            dev && /^### / { print item "\n"; dev = 0 }
            { print }
          ' README.md > README.tmp && mv README.tmp README.md
          grep -qF -- "$ITEM" README.md

          echo "EXT_VERSION=$EXT_VERSION" >> "$GITHUB_ENV"
          git diff

      - name: Commit and push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: Bump extension to $EXT_VERSION"
          git push origin "HEAD:${{ github.ref_name }}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Build the extension on all platforms.
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            code-target: win32-x64
          # - os: windows-latest
          #   target: aarch64-pc-windows-msvc
          #   code-target: win32-arm64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            code-target: linux-x64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            code-target: linux-arm64
            arch: aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            code-target: darwin-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            code-target: darwin-arm64

    name: Build (${{ matrix.target }})
    needs: ["prepare"]
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: ./editors/code

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: ${{ env.FETCH_DEPTH }}

      - name: Download jarl binary (macOS or Linux)
        if: ${{ startsWith(matrix.os, 'macos') || startsWith(matrix.os, 'ubuntu') }}
        # Download, unpack, move into place, and clean up
        run: |
          ARCHIVE_NAME=jarl-${{ matrix.target }}
          ARCHIVE_FILE=$ARCHIVE_NAME.tar.gz

          curl -LsSfO https://github.com/etiennebacher/jarl/releases/download/${{ inputs.tag }}/$ARCHIVE_FILE
          tar -xvzf $ARCHIVE_FILE
          mkdir -p bundled/bin/
          mv $ARCHIVE_NAME/jarl bundled/bin/jarl
          rm -R $ARCHIVE_NAME
          rm -R $ARCHIVE_FILE

      - name: Download jarl binary (Windows)
        if: ${{ startsWith(matrix.os, 'windows') }}
        # Download, unpack, move into place, and clean up
        # Use git bash
        shell: bash
        run: |
          ARCHIVE_NAME=jarl-${{ matrix.target }}
          ARCHIVE_FILE=$ARCHIVE_NAME.zip

          curl -LsSfO https://github.com/etiennebacher/jarl/releases/download/${{ inputs.tag }}/$ARCHIVE_FILE
          unzip $ARCHIVE_FILE
          mkdir -p bundled/bin/
          mv jarl.exe bundled/bin/jarl.exe
          rm -R $ARCHIVE_FILE

      # Install Node.
      - name: Install Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22

      # Install Node dependencies.
      - run: npm ci

      # Build the extension.
      - name: Package Extension (release)
        run: npx @vscode/vsce package -o "./dist/jarl-${{ matrix.code-target }}.vsix" --target ${{ matrix.code-target }}

      # Upload the extension.
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: ./editors/code/dist

  # Publish the built extension to the Code Marketplace.
  publish-code-marketplace:
    name: "Publish (Code Marketplace)"
    needs: ["build"]
    runs-on: ubuntu-latest
    steps:
      - name: Install Nodejs
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22

      # Download all built artifacts.
      - uses: actions/download-artifact@v8
        with:
          name: dist-aarch64-apple-darwin
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: dist-x86_64-apple-darwin
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: dist-x86_64-unknown-linux-gnu
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: dist-aarch64-unknown-linux-gnu
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: dist-x86_64-pc-windows-msvc
          path: dist
      # - uses: actions/download-artifact@v8
      #   with:
      #     name: dist-aarch64-pc-windows-msvc
      #     path: dist
      - run: ls -al ./dist

      # Publish to the Code Marketplace.
      - name: Publish Extension (Code Marketplace, release)
        run: npx @vscode/vsce publish --pat ${{ secrets.VSCE_PAT }} --packagePath ./dist/jarl-*.vsix

  # Publish the built extension to OpenVSX
  publish-openvsx:
    name: "Publish (OpenVSX)"
    needs: ["build"]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Install Nodejs
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22

      # Download all built artifacts.
      - uses: actions/download-artifact@v8
        with:
          name: dist-aarch64-apple-darwin
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: dist-x86_64-apple-darwin
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: dist-x86_64-unknown-linux-gnu
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: dist-aarch64-unknown-linux-gnu
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: dist-x86_64-pc-windows-msvc
          path: dist
      # - uses: actions/download-artifact@v8
      #   with:
      #     name: dist-aarch64-pc-windows-msvc
      #     path: dist
      - run: ls -al ./dist

      # Publish to OpenVSX.
      - name: Publish Extension (OpenVSX, release)
        run: npx ovsx publish --pat ${{ secrets.OPEN_VSX_TOKEN }} --packagePath ./dist/jarl-*.vsix
