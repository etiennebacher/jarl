# This workflow triggers the update in the docs and the release. This allows
# the current "dev" docs to be automatically moved to "stable". Stable releases
# are also published to PyPI, the VS Code Marketplace, and OpenVSX.

name: Release workflow to run

permissions:
  actions: write

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release Tag
        required: true
        default: dry-run
        type: string

jobs:
  # Stable releases must not ship rules documented as "Version added: unreleased"
  # (`just set-rule-versions` replaces them with the release version).
  check-rule-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        if: ${{ !contains(inputs.tag, '-') }}
      - name: Check that no rule has "Version added: unreleased"
        if: ${{ !contains(inputs.tag, '-') }}
        run: |
          matches=$(grep -rnE '^/// Version added: unreleased\b' crates/jarl-core/src/lints || true)
          if [ -n "$matches" ]; then
            while IFS=: read -r file line _; do
              echo "::error file=$file,line=$line::Rule documented as 'Version added: unreleased'."
            done <<< "$matches"
            echo "Some rules still have 'Version added: unreleased'. Run 'just set-rule-versions' (and 'just document --no-quarto'), commit, and re-run this workflow."
            exit 1
          fi

  release:
    needs: check-rule-versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Record the time just before dispatching so we can find the run
            const before = new Date().toISOString();

            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: 'release.yml',
              ref: context.ref,
              inputs: { tag: '${{ inputs.tag }}' }
            });

            // Wait a bit for GitHub to register the new run
            await new Promise(r => setTimeout(r, 15000));

            // Find the workflow run we just triggered
            const workflows = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'release.yml',
              created: `>=${before}`,
              per_page: 1
            });

            if (workflows.data.workflow_runs.length === 0) {
              throw new Error('Could not find the dispatched release workflow run');
            }

            const runId = workflows.data.workflow_runs[0].id;
            core.info(`Found release workflow run: ${runId}`);

            // Poll until the run completes
            const pollInterval = 60000; // 1 minute
            const timeout = 5400000; // 90 minutes
            const start = Date.now();

            while (Date.now() - start < timeout) {
              const run = await github.rest.actions.getWorkflowRun({
                owner,
                repo,
                run_id: runId
              });

              const status = run.data.status;
              const conclusion = run.data.conclusion;
              core.info(`Run ${runId}: status=${status}, conclusion=${conclusion}`);

              if (status === 'completed') {
                if (conclusion === 'success') {
                  core.info('Release workflow completed successfully');
                  return;
                }
                throw new Error(`Release workflow failed with conclusion: ${conclusion}`);
              }

              await new Promise(r => setTimeout(r, pollInterval));
            }

            throw new Error('Timed out waiting for release workflow to complete');

  docs-stable:
    needs: release
    # Do not trigger on alpha binaries release
    if: ${{ !contains(inputs.tag, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'docs.yml',
              ref: context.ref,
              inputs: { version: 'stable' }
            });

  pypi:
    needs: release
    # Do not trigger on alpha binaries release
    if: ${{ !contains(inputs.tag, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            // `release-pypi.yml` expects a version without a leading `v`
            const version = '${{ inputs.tag }}'.replace(/^v/, '');

            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'release-pypi.yml',
              ref: context.ref,
              inputs: { version, dry_run: 'false' }
            });

  vscode:
    needs: release
    # Do not trigger on alpha binaries release
    if: ${{ !contains(inputs.tag, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'release-vscode.yml',
              ref: context.ref,
              inputs: { tag: '${{ inputs.tag }}' }
            });
