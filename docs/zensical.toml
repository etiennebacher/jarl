# Configuration of the documentation website, built with Zensical
# (`zensical build` or `zensical serve`).
#
# This file describes the "dev" website. The CI derives the "stable" website
# from it by changing `site_url` and `extra.channel` (see .github/workflows/docs.yml).

[project]
site_name = "Jarl"
site_url = "https://jarl.etiennebacher.com/dev/"
site_description = "Just Another R Linter"
site_dir = "_site"
docs_dir = "."
repo_url = "https://github.com/etiennebacher/jarl"
repo_name = "etiennebacher/jarl"
edit_uri = "edit/main/docs/"

# Files in `docs/` that are not pages.
exclude_docs = """
*.R
*.toml
_site/
overrides/
"""

extra_css = ["assets/styles.css"]
extra_javascript = ["assets/rules-filter.js"]

