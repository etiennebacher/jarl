[project.extra]
# "dev" or "stable". The dev website shows a banner and the version switcher
# highlights the right entry.
channel = "dev"

[project.extra.version]
provider = "mike"

[project.theme]
variant = "classic"
language = "en"
custom_dir = "overrides"
features = [
  "announce.dismiss",
  "content.code.copy",
  "content.footnote.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.font]
text = "Nunito Sans"
code = "Roboto Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/etiennebacher/jarl"
name = "Jarl on GitHub"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
toc.toc_depth = "2-4"
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.superfences = {}
pymdownx.tasklist.custom_checkbox = true
# Turns `#123` and `@user` in the changelog into links.
pymdownx.magiclink.repo_url_shorthand = true
pymdownx.magiclink.provider = "github"
pymdownx.magiclink.user = "etiennebacher"
pymdownx.magiclink.repo = "jarl"
pymdownx.magiclink.hide_protocol = false
